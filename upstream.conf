# Upstream Apache Maven release this port is built from: the binary distribution,
# verified by fetch.sh against its SHA-512 and the release manager's signature.
UPSTREAM_NAME=apache-maven
UPSTREAM_VERSION=3.9.16
UPSTREAM_URL=https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
UPSTREAM_SHA512=831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6
# Slawomir Jaranowski, from https://downloads.apache.org/maven/KEYS
# Public key: keys/maven-signing-key.asc
UPSTREAM_GPG_KEY=84789D24DF77A32433CE1F079EB80E92EB2135B1
# Our patch level on top of the upstream release (3.9.16-vms1)
VMS_PATCH_LEVEL=1
# Jars we patch. Maven is Java, so a patch changes the source of a class in one of
# the jars in lib/: fetch.sh gets that jar's -sources.jar from Maven Central
# (verified like the distribution), prepare.sh unpacks the files the patches touch
# into vmsport/src/<artifact>/, and BUILD.COM compiles them on the node and puts
# the classes back into lib/<artifact>-<version>.jar.
# Format: <groupId>:<artifactId>:<version> <sha512 of the -sources.jar> <signing key>
PATCHED_JARS="
org.apache.maven.resolver:maven-resolver-impl:1.9.27 a3b3bd145bca6330d4e60303443caf47ebdf424f1da7c0bec2f4615ba6e5588a3b7c544a90546cf16da5159d402197f3a2a420a51d8c3c5043b9b1796a745787 88BE34F94BDB2B5357044E2E3A387D43964143E3
"
# Maven Central, for the -sources.jar files above.
CENTRAL_URL=https://repo.maven.apache.org/maven2
# Java: Maven 3.9 runs on Java 8, which is what both nodes have (VSI OpenJDK 8).
# Kit: no VSI Maven kit exists, so the product is MAVEN with MAVEN$ROOT.
KIT_PRODUCT=MAVEN
