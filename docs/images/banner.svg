<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Apache Maven for OpenVMS">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#0d1824"/><stop offset="1" stop-color="#16323f"/></linearGradient>
<linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
